properties:
  environmentId: __ENVIRONMENT_ID__
  configuration:
    activeRevisionsMode: single
    ingress:
      external: true
      allowInsecure: false
      targetPort: 4533
      transport: auto
  template:
    containers:
      - name: navidrome
        image: __NAVIDROME_IMAGE__
        resources:
          cpu: 0.5
          memory: 1Gi
        env:
          - name: ND_MUSICFOLDER
            value: /music
          - name: ND_DATAFOLDER
            value: /data
          - name: ND_SCANNER_SCHEDULE
            value: "@every 1h"
          - name: ND_ENABLEUSERREGISTRATION
            value: "false"
          - name: ND_LOGLEVEL
            value: info
          - name: ND_PLUGINS_ENABLED
            value: "true"
          - name: ND_PLUGINS_FOLDER
            value: /plugins
          - name: ND_PLUGINS_AUTORELOAD
            value: "true"
          - name: ND_AGENTS
            value: "deezer,lastfm,listenbrainz,coverartarchive"
          - name: ND_LYRICSPRIORITY
            value: "embedded,.lrc,.txt,nd-lyrics"
        volumeMounts:
          - volumeName: music
            mountPath: /music
          - volumeName: data
            mountPath: /data
    scale:
      minReplicas: 0
      maxReplicas: 1
    volumes:
      - name: music
        storageType: AzureFile
        storageName: music-readonly
        mountOptions: dir_mode=0777,file_mode=0666,uid=1000,gid=1000
      - name: data
        storageType: AzureFile
        storageName: navidrome-data
        mountOptions: dir_mode=0777,file_mode=0666,uid=1000,gid=1000,nobrl
